services:
  darkartswhiskey-server:
    build: .
    command: node server.js
    restart: unless-stopped
    env_file: darkartswhiskey.env
    environment:
      - TZ=America/New_York
    networks:
      - proxy
      - darkartswhiskey-internal
      - shopify-egress
    labels:
      - "traefik.enable=true"

      # HTTPS router
      - "traefik.http.routers.darkartswhiskey.rule=Host(`darkartswhiskey.linger.dev`)"
      - "traefik.http.routers.darkartswhiskey.entrypoints=websecure"
      - "traefik.http.routers.darkartswhiskey.tls.certresolver=leresolver"
      - "traefik.http.services.darkartswhiskey.loadbalancer.server.port=3000"

      # HTTP router + redirect middleware
      - "traefik.http.routers.darkartswhiskey-http.rule=Host(`darkartswhiskey.linger.dev`)"
      - "traefik.http.routers.darkartswhiskey-http.entrypoints=web"
      - "traefik.http.routers.darkartswhiskey-http.middlewares=redirect-to-https"

      # Redirect middleware definition
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

      # Watchtower
      - "com.centurylinklabs.watchtower.enable=false"

  darkartswhiskey-watcher:
    build: .
    command: node watcher.js
    restart: unless-stopped
    env_file: darkartswhiskey.env
    environment:
      - TZ=America/New_York
    volumes:
      - darkartswhiskey-data:/data
    networks:
      - darkartswhiskey-internal
      - shopify-egress
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

networks:
  shopify-egress:
    external: true
  proxy:
    external: true
  darkartswhiskey-internal:

volumes:
  darkartswhiskey-data:
