services:
  bigbottleshop-server:
    build: .
    command: node server.js
    restart: unless-stopped
    env_file: bigbottleshop.env
    environment:
      - TZ=America/New_York
    networks:
      - proxy
      - bigbottleshop-internal
      - shopify-egress
    labels:
      - "traefik.enable=true"

      # HTTPS router
      - "traefik.http.routers.bigbottleshop.rule=Host(`bigbottleshop.linger.dev`)"
      - "traefik.http.routers.bigbottleshop.entrypoints=websecure"
      - "traefik.http.routers.bigbottleshop.tls.certresolver=leresolver"
      - "traefik.http.services.bigbottleshop.loadbalancer.server.port=3000"

      # HTTP router + redirect middleware
      - "traefik.http.routers.bigbottleshop-http.rule=Host(`bigbottleshop.linger.dev`)"
      - "traefik.http.routers.bigbottleshop-http.entrypoints=web"
      - "traefik.http.routers.bigbottleshop-http.middlewares=redirect-to-https"

      # Redirect middleware definition
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

      # Watchtower
      - "com.centurylinklabs.watchtower.enable=false"

  bigbottleshop-watcher:
    build: .
    command: node watcher.js
    restart: unless-stopped
    env_file: bigbottleshop.env
    environment:
      - TZ=America/New_York
    volumes:
      - bigbottleshop-data:/data
    networks:
      - bigbottleshop-internal
      - shopify-egress
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

networks:
  shopify-egress:
    external: true
  proxy:
    external: true
  bigbottleshop-internal:
    ipam:
      config:
        # Docker's default address pools are exhausted — explicit subnet required.
        # Taken: 10.201.0.0/24 dramfellows, 10.201.1.0/24 shopify-egress,
        # 10.201.2.0/24 dramcellars, 10.201.3.0/24 kingscountydistillery,
        # 10.201.4.0/24 preetliquor, 10.201.5.0/24 tallacliquors.
        - subnet: 10.201.6.0/24

volumes:
  bigbottleshop-data:
