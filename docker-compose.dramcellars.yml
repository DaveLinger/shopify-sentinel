services:
  dramcellars-server:
    build: .
    command: node server.js
    restart: unless-stopped
    env_file: dramcellars.env
    environment:
      - TZ=America/New_York
    networks:
      - proxy
      - dramcellars-internal
      - shopify-egress
    labels:
      - "traefik.enable=true"

      # HTTPS router
      - "traefik.http.routers.dramcellars.rule=Host(`dramcellars.linger.dev`)"
      - "traefik.http.routers.dramcellars.entrypoints=websecure"
      - "traefik.http.routers.dramcellars.tls.certresolver=leresolver"
      - "traefik.http.services.dramcellars.loadbalancer.server.port=3000"

      # HTTP router + redirect middleware
      - "traefik.http.routers.dramcellars-http.rule=Host(`dramcellars.linger.dev`)"
      - "traefik.http.routers.dramcellars-http.entrypoints=web"
      - "traefik.http.routers.dramcellars-http.middlewares=redirect-to-https"

      # Redirect middleware definition
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

      # Watchtower
      - "com.centurylinklabs.watchtower.enable=false"

  dramcellars-watcher:
    build: .
    command: node watcher.js
    restart: unless-stopped
    env_file: dramcellars.env
    environment:
      - TZ=America/New_York
    volumes:
      - dramcellars-data:/data
    networks:
      - dramcellars-internal
      - shopify-egress
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

networks:
  shopify-egress:
    external: true
  proxy:
    external: true
  dramcellars-internal:
    ipam:
      config:
        # Docker's default address pools are exhausted — explicit subnet required.
        # Taken: 10.201.0.0/24 dramfellows, 10.201.1.0/24 shopify-egress.
        - subnet: 10.201.2.0/24

volumes:
  dramcellars-data:
