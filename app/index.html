<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Catalog</title>
<!-- CONFIG -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f4f0; color: #222; }
  header { background: #1a1a1a; color: #fff; padding: 18px 28px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 1.3rem; font-weight: 600; letter-spacing: 0.03em; }
  header span.domain { font-size: 0.85rem; color: #aaa; }
  #status { margin-left: auto; font-size: 0.82rem; color: #aaa; }
  #status.error { color: #f87171; }
  .controls { background: #fff; border-bottom: 1px solid #ddd; padding: 14px 20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .controls input, .controls select { border: 1px solid #ccc; border-radius: 6px; padding: 7px 11px; font-size: 0.875rem; outline: none; }
  .controls input:focus, .controls select:focus { border-color: #888; }
  .controls input[type=search] { min-width: 220px; flex: 1; }
  #count { margin-left: auto; font-size: 0.82rem; color: #666; white-space: nowrap; }
  .loading-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 20px; gap: 16px; }
  .spinner { width: 40px; height: 40px; border: 4px solid #ddd; border-top-color: #1a1a1a; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-wrap p { color: #666; font-size: 0.9rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
  thead th { background: #1a1a1a; color: #fff; padding: 11px 14px; text-align: left; cursor: pointer; user-select: none; white-space: nowrap; position: sticky; top: 0; z-index: 2; }
  thead th:hover { background: #333; }
  thead th.sort-asc::after { content: ' ↑'; }
  thead th.sort-desc::after { content: ' ↓'; }
  tbody tr { border-bottom: 1px solid #eee; background: #fff; transition: background 0.1s; }
  tbody tr:hover { background: #f9f7f4; }
  tbody tr.unavailable { opacity: 0.55; }
  td { padding: 9px 14px; vertical-align: middle; }
  td.img-cell { width: 64px; padding: 6px 10px; }
  td.img-cell img { width: 52px; height: 52px; object-fit: contain; border-radius: 4px; background: #f5f5f5; display: block; }
  td.img-cell .no-img { width: 52px; height: 52px; background: #eee; border-radius: 4px; }
  td.title-cell { max-width: 240px; }
  td.title-cell a { color: #1a1a1a; text-decoration: none; font-weight: 500; }
  td.title-cell a:hover { text-decoration: underline; color: #c0392b; }
  td.tags-cell { max-width: 180px; font-size: 0.77rem; color: #777; }
  td.date-cell { white-space: nowrap; font-size: 0.8rem; color: #555; }
  .tag { display: inline-block; background: #eee; border-radius: 3px; padding: 2px 5px; margin: 1px 2px; }
  .badge-avail { display: inline-block; padding: 2px 7px; border-radius: 10px; font-size: 0.75rem; font-weight: 600; }
  .badge-yes { background: #d4edda; color: #155724; }
  .badge-no { background: #f8d7da; color: #721c24; }
  .price { font-weight: 600; }
  .compare { text-decoration: line-through; color: #999; font-size: 0.8rem; margin-left: 4px; }
  .sale { color: #c0392b; }
  .discount { font-weight: 600; }
  .discount-none { color: #bbb; }
  .table-wrap { overflow-x: auto; }
  #main-controls { display: none; }
  @media(max-width: 700px) { td.tags-cell, th.tags-col { display: none; } }
  .no-type th[data-col="product_type"],
  .no-type td.type-cell,
  .no-type .type-filter { display: none; }
</style>
</head>
<body>
<header>
  <h1 id="header-title"></h1>
  <span class="domain" id="header-domain"></span>
  <span id="status">Loading products…</span>
</header>
<div class="controls" id="main-controls">
  <input type="search" id="search" placeholder="Search by title, vendor, tag…">
  <select id="filter-type" class="type-filter"><option value="">All Types</option></select>
  <select id="filter-vendor"><option value="">All Vendors</option></select>
  <select id="filter-avail">
    <option value="">All Availability</option>
    <option value="true">In Stock</option>
    <option value="false">Out of Stock</option>
  </select>
  <span id="count"></span>
</div>
<div id="loading-wrap" class="loading-wrap">
  <div class="spinner"></div>
  <p id="loading-msg">Fetching products…</p>
</div>
<div class="table-wrap" id="table-wrap" style="display:none">
  <table id="ptable">
    <thead>
      <tr>
        <th></th>
        <th data-col="title">Title</th>
        <th data-col="vendor">Vendor</th>
        <th data-col="product_type">Type</th>
        <th data-col="price">Price</th>
        <th data-col="discount">Discount</th>
        <th data-col="available">Available</th>
        <th data-col="variant_count">Variants</th>
        <th data-col="created_at">Created</th>
        <th class="tags-col">Tags</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>
<script>
// Apply branding and feature flags from server-injected CONFIG
document.title = CONFIG.pageTitle;
document.getElementById('header-title').textContent = CONFIG.headerTitle;
document.getElementById('header-domain').textContent = CONFIG.headerDomain;
if (!CONFIG.showTypeColumn) document.body.classList.add('no-type');
if (CONFIG.defaultAvailFilter) document.getElementById('filter-avail').value = CONFIG.defaultAvailFilter;

let RAW = [];
let sortCol = 'created_at', sortDir = -1;

function fmtDate(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
}

function populateFilters() {
  const types = [...new Set(RAW.map(p => p.product_type).filter(Boolean))].sort();
  const vendors = [...new Set(RAW.map(p => p.vendor).filter(Boolean))].sort();
  const typeEl = document.getElementById('filter-type');
  const vendorEl = document.getElementById('filter-vendor');
  types.forEach(t => { const o = document.createElement('option'); o.value = t; o.textContent = t; typeEl.appendChild(o); });
  vendors.forEach(v => { const o = document.createElement('option'); o.value = v; o.textContent = v; vendorEl.appendChild(o); });
}

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const fType = document.getElementById('filter-type').value;
  const fVendor = document.getElementById('filter-vendor').value;
  const fAvail = document.getElementById('filter-avail').value;

  let filtered = RAW.filter(p => {
    if (fType && p.product_type !== fType) return false;
    if (fVendor && p.vendor !== fVendor) return false;
    if (fAvail !== '' && String(p.available) !== fAvail) return false;
    if (q) {
      const hay = (p.title + ' ' + p.vendor + ' ' + p.product_type + ' ' + (p.tags||[]).join(' ')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  filtered.sort((a, b) => {
    let av = a[sortCol], bv = b[sortCol];
    if (sortCol === 'created_at') {
      av = av || ''; bv = bv || '';
      if (av < bv) return -sortDir; if (av > bv) return sortDir; return 0;
    }
    if (typeof av === 'string') av = av.toLowerCase();
    if (typeof bv === 'string') bv = bv.toLowerCase();
    if (av == null) av = ''; if (bv == null) bv = '';
    if (av < bv) return -sortDir; if (av > bv) return sortDir; return 0;
  });

  document.getElementById('tbody').innerHTML = filtered.map(p => {
    const imgHtml = p.image ? '<img src="' + p.image + '" alt="" loading="lazy">' : '<div class="no-img"></div>';
    const isSale = p.compare_at_price && p.compare_at_price > p.price;
    const priceHtml = isSale
      ? '<span class="price sale">$' + p.price.toFixed(2) + '</span><span class="compare">$' + p.compare_at_price.toFixed(2) + '</span>'
      : '<span class="price">$' + p.price.toFixed(2) + '</span>';
    const discountHtml = p.discount > 0
      ? '<span class="discount sale">' + p.discount + '%</span>'
      : '<span class="discount-none">—</span>';
    const availBadge = p.available
      ? '<span class="badge-avail badge-yes">In Stock</span>'
      : '<span class="badge-avail badge-no">Out of Stock</span>';
    const tags = (p.tags||[]).slice(0,5).map(t => '<span class="tag">' + t + '</span>').join('');
    return '<tr class="' + (p.available ? '' : 'unavailable') + '">'
      + '<td class="img-cell">' + imgHtml + '</td>'
      + '<td class="title-cell"><a href="' + CONFIG.productUrlBase + p.handle + '" target="_blank">' + p.title + '</a></td>'
      + '<td>' + (p.vendor||'') + '</td>'
      + '<td class="type-cell">' + (p.product_type||'') + '</td>'
      + '<td>' + priceHtml + '</td>'
      + '<td style="text-align:right">' + discountHtml + '</td>'
      + '<td>' + availBadge + '</td>'
      + '<td style="text-align:center">' + p.variant_count + '</td>'
      + '<td class="date-cell">' + fmtDate(p.created_at) + '</td>'
      + '<td class="tags-cell">' + tags + '</td>'
      + '</tr>';
  }).join('');

  document.getElementById('count').textContent = filtered.length + ' / ' + RAW.length + ' products';
}

document.querySelectorAll('thead th[data-col]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    sortDir = (sortCol === col) ? -sortDir : (col === 'discount' ? -1 : 1);
    sortCol = col;
    document.querySelectorAll('thead th').forEach(t => t.classList.remove('sort-asc','sort-desc'));
    th.classList.add(sortDir === 1 ? 'sort-asc' : 'sort-desc');
    render();
  });
});
['search','filter-type','filter-vendor','filter-avail'].forEach(id => {
  document.getElementById(id).addEventListener('input', render);
});

async function loadAllProducts() {
  try {
    const r = await fetch('/api/products.json');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    RAW = (data.products || []).map(p => {
      const price = parseFloat(p.variants[0].price);
      const compareAt = p.variants[0].compare_at_price ? parseFloat(p.variants[0].compare_at_price) : null;
      const discount = (compareAt && compareAt > price) ? Math.round((compareAt - price) / compareAt * 100) : 0;
      return {
        id: p.id,
        title: p.title,
        handle: p.handle,
        vendor: p.vendor,
        product_type: p.product_type,
        tags: typeof p.tags === 'string' ? p.tags.split(',').map(t => t.trim()).filter(Boolean) : (p.tags || []),
        price: price,
        compare_at_price: compareAt,
        discount: discount,
        available: p.variants.some(v => v.available),
        variant_count: p.variants.length,
        image: p.images && p.images[0] ? p.images[0].src : null,
        created_at: p.created_at
      };
    });
    document.getElementById('loading-wrap').style.display = 'none';
    document.getElementById('table-wrap').style.display = '';
    document.getElementById('main-controls').style.display = 'flex';
    document.getElementById('status').textContent = 'Loaded ' + RAW.length + ' products';
    populateFilters();
    document.querySelector('th[data-col="created_at"]').classList.add('sort-desc');
    render();
  } catch(err) {
    document.getElementById('loading-msg').textContent = 'Failed to load products: ' + err.message;
    document.querySelector('.spinner').style.display = 'none';
    document.getElementById('status').textContent = 'Error';
    document.getElementById('status').className = 'error';
  }
}

loadAllProducts();
</script>
</body>
</html>
