<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Catalog</title>
<!-- CONFIG -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f4f0; color: #222; }
  header { background: #1a1a1a; color: #fff; padding: 18px 28px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 1.3rem; font-weight: 600; letter-spacing: 0.03em; }
  header span.domain { font-size: 0.85rem; color: #aaa; }
  #status { margin-left: auto; font-size: 0.82rem; color: #aaa; }
  #status.error { color: #f87171; }
  .controls { background: #fff; border-bottom: 1px solid #ddd; padding: 14px 20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .controls input, .controls select { border: 1px solid #ccc; border-radius: 6px; padding: 7px 11px; font-size: 0.875rem; outline: none; }
  .controls input:focus, .controls select:focus { border-color: #888; }
  .controls input[type=search] { min-width: 220px; flex: 1; }
  #count { margin-left: auto; font-size: 0.82rem; color: #666; white-space: nowrap; }
  .loading-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 20px; gap: 16px; }
  .spinner { width: 40px; height: 40px; border: 4px solid #ddd; border-top-color: #1a1a1a; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-wrap p { color: #666; font-size: 0.9rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
  thead th { background: #1a1a1a; color: #fff; padding: 11px 14px; text-align: left; cursor: pointer; user-select: none; white-space: nowrap; position: sticky; top: 0; z-index: 2; }
  thead th:hover { background: #333; }
  thead th.sort-asc::after { content: ' ↑'; }
  thead th.sort-desc::after { content: ' ↓'; }
  tbody tr { border-bottom: 1px solid #eee; background: #fff; transition: background 0.1s; }
  tbody tr:hover { background: #f9f7f4; }
  tbody tr.unavailable { opacity: 0.55; }
  td { padding: 9px 14px; vertical-align: middle; }
  td.img-cell { width: 64px; padding: 6px 10px; }
  td.img-cell img { width: 52px; height: 52px; object-fit: contain; border-radius: 4px; background: #f5f5f5; display: block; }
  td.img-cell .no-img { width: 52px; height: 52px; background: #eee; border-radius: 4px; }
  td.title-cell { max-width: 240px; }
  td.title-cell a { color: #1a1a1a; text-decoration: none; font-weight: 500; }
  td.title-cell a:hover { text-decoration: underline; color: #c0392b; }
  td.tags-cell { max-width: 180px; font-size: 0.77rem; color: #777; }
  td.date-cell { white-space: nowrap; font-size: 0.8rem; color: #555; }
  .tag { display: inline-block; background: #eee; border-radius: 3px; padding: 2px 5px; margin: 1px 2px; }
  .badge-avail { display: inline-block; padding: 2px 7px; border-radius: 10px; font-size: 0.75rem; font-weight: 600; }
  .badge-yes { background: #d4edda; color: #155724; }
  .badge-no { background: #f8d7da; color: #721c24; }
  .price { font-weight: 600; }
  .compare { text-decoration: line-through; color: #999; font-size: 0.8rem; margin-left: 4px; }
  .sale { color: #c0392b; }
  .discount { font-weight: 600; }
  .discount-none { color: #bbb; }
  .table-wrap { overflow-x: auto; }
  #main-controls { display: none; }
  #filter-collection { min-width: 260px; }
  .collection-note { background: #fff8e6; border-bottom: 1px solid #e8d9a8; padding: 9px 20px; font-size: 0.83rem; color: #6b5626; display: flex; gap: 12px; align-items: center; }
  .collection-note a { color: #8a5a00; }
  @media(max-width: 700px) { td.tags-cell, th.tags-col { display: none; } }
  .no-type th[data-col="product_type"],
  .no-type td.type-cell,
  .no-type .type-filter { display: none; }
</style>
</head>
<body>
<header>
  <h1 id="header-title"></h1>
  <span class="domain" id="header-domain"></span>
  <span id="status">Loading products…</span>
</header>
<div class="controls" id="main-controls">
  <input type="search" id="search" placeholder="Search by title, vendor, tag…">
  <input type="search" id="filter-collection" list="collection-list" autocomplete="off"
         placeholder="All collections — type a name, handle or URL">
  <datalist id="collection-list"></datalist>
  <select id="filter-type" class="type-filter"><option value="">All Types</option></select>
  <select id="filter-vendor"><option value="">All Vendors</option></select>
  <select id="filter-avail">
    <option value="">All Availability</option>
    <option value="true">In Stock</option>
    <option value="false">Out of Stock</option>
  </select>
  <span id="count"></span>
</div>
<div class="collection-note" id="collection-note" style="display:none">
  <span id="collection-note-text"></span>
  <a href="#" id="collection-clear">show all products</a>
</div>
<div id="loading-wrap" class="loading-wrap">
  <div class="spinner"></div>
  <p id="loading-msg">Fetching products…</p>
</div>
<div class="table-wrap" id="table-wrap" style="display:none">
  <table id="ptable">
    <thead>
      <tr>
        <th></th>
        <th data-col="title">Title</th>
        <th data-col="vendor">Vendor</th>
        <th data-col="product_type">Type</th>
        <th data-col="price">Price</th>
        <th data-col="discount">Discount</th>
        <th data-col="available">Available</th>
        <th data-col="variant_count">Variants</th>
        <th data-col="created_at">Created</th>
        <th class="tags-col">Tags</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>
<script>
// Apply branding and feature flags from server-injected CONFIG
document.title = CONFIG.pageTitle;
document.getElementById('header-title').textContent = CONFIG.headerTitle;
document.getElementById('header-domain').textContent = CONFIG.headerDomain;
if (!CONFIG.showTypeColumn) document.body.classList.add('no-type');
if (CONFIG.defaultAvailFilter) document.getElementById('filter-avail').value = CONFIG.defaultAvailFilter;

let RAW = [];
let sortCol = 'created_at', sortDir = -1;

function fmtDate(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
}

function populateFilters() {
  const types = [...new Set(RAW.map(p => p.product_type).filter(Boolean))].sort();
  const vendors = [...new Set(RAW.map(p => p.vendor).filter(Boolean))].sort();
  const typeEl = document.getElementById('filter-type');
  const vendorEl = document.getElementById('filter-vendor');
  // Rebuilt on every collection switch, so reset to the placeholder option
  // first — otherwise each switch appends another copy of every type.
  typeEl.innerHTML = '<option value="">All Types</option>';
  vendorEl.innerHTML = '<option value="">All Vendors</option>';
  types.forEach(t => { const o = document.createElement('option'); o.value = t; o.textContent = t; typeEl.appendChild(o); });
  vendors.forEach(v => { const o = document.createElement('option'); o.value = v; o.textContent = v; vendorEl.appendChild(o); });
  // A type/vendor that no longer exists in this collection would filter
  // everything out with no visible cause.
  if (![...typeEl.options].some(o => o.value === typeEl.value)) typeEl.value = '';
  if (![...vendorEl.options].some(o => o.value === vendorEl.value)) vendorEl.value = '';
}

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const fType = document.getElementById('filter-type').value;
  const fVendor = document.getElementById('filter-vendor').value;
  const fAvail = document.getElementById('filter-avail').value;

  let filtered = RAW.filter(p => {
    if (fType && p.product_type !== fType) return false;
    if (fVendor && p.vendor !== fVendor) return false;
    if (fAvail !== '' && String(p.available) !== fAvail) return false;
    if (q) {
      const hay = (p.title + ' ' + p.vendor + ' ' + p.product_type + ' ' + (p.tags||[]).join(' ')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  filtered.sort((a, b) => {
    let av = a[sortCol], bv = b[sortCol];
    if (sortCol === 'created_at') {
      av = av || ''; bv = bv || '';
      if (av < bv) return -sortDir; if (av > bv) return sortDir; return 0;
    }
    if (typeof av === 'string') av = av.toLowerCase();
    if (typeof bv === 'string') bv = bv.toLowerCase();
    if (av == null) av = ''; if (bv == null) bv = '';
    if (av < bv) return -sortDir; if (av > bv) return sortDir; return 0;
  });

  document.getElementById('tbody').innerHTML = filtered.map(p => {
    const imgHtml = p.image ? '<img src="' + p.image + '" alt="" loading="lazy">' : '<div class="no-img"></div>';
    const isSale = p.compare_at_price && p.compare_at_price > p.price;
    const priceHtml = isSale
      ? '<span class="price sale">$' + p.price.toFixed(2) + '</span><span class="compare">$' + p.compare_at_price.toFixed(2) + '</span>'
      : '<span class="price">$' + p.price.toFixed(2) + '</span>';
    const discountHtml = p.discount > 0
      ? '<span class="discount sale">' + p.discount + '%</span>'
      : '<span class="discount-none">—</span>';
    const availBadge = p.available
      ? '<span class="badge-avail badge-yes">In Stock</span>'
      : '<span class="badge-avail badge-no">Out of Stock</span>';
    const tags = (p.tags||[]).slice(0,5).map(t => '<span class="tag">' + t + '</span>').join('');
    return '<tr class="' + (p.available ? '' : 'unavailable') + '">'
      + '<td class="img-cell">' + imgHtml + '</td>'
      + '<td class="title-cell"><a href="' + CONFIG.productUrlBase + p.handle + '" target="_blank">' + p.title + '</a></td>'
      + '<td>' + (p.vendor||'') + '</td>'
      + '<td class="type-cell">' + (p.product_type||'') + '</td>'
      + '<td>' + priceHtml + '</td>'
      + '<td style="text-align:right">' + discountHtml + '</td>'
      + '<td>' + availBadge + '</td>'
      + '<td style="text-align:center">' + p.variant_count + '</td>'
      + '<td class="date-cell">' + fmtDate(p.created_at) + '</td>'
      + '<td class="tags-cell">' + tags + '</td>'
      + '</tr>';
  }).join('');

  document.getElementById('count').textContent = filtered.length + ' / ' + RAW.length + ' products';
  syncUrl();
}

document.querySelectorAll('thead th[data-col]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    sortDir = (sortCol === col) ? -sortDir : (col === 'discount' ? -1 : 1);
    sortCol = col;
    markSortHeader();
    render();
  });
});
['search','filter-type','filter-vendor','filter-avail'].forEach(id => {
  document.getElementById(id).addEventListener('input', render);
});

function mapProducts(list) {
  return (list || []).map(p => {
    const price = parseFloat(p.variants[0].price);
    const compareAt = p.variants[0].compare_at_price ? parseFloat(p.variants[0].compare_at_price) : null;
    const discount = (compareAt && compareAt > price) ? Math.round((compareAt - price) / compareAt * 100) : 0;
    return {
      id: p.id,
      title: p.title,
      handle: p.handle,
      vendor: p.vendor,
      product_type: p.product_type,
      tags: typeof p.tags === 'string' ? p.tags.split(',').map(t => t.trim()).filter(Boolean) : (p.tags || []),
      price: price,
      compare_at_price: compareAt,
      discount: discount,
      available: p.variants.some(v => v.available),
      variant_count: p.variants.length,
      image: p.images && p.images[0] ? p.images[0].src : null,
      created_at: p.created_at
    };
  });
}

// ── Collections ────────────────────────────────────────────────────────────
// A collection view is fetched live from Shopify rather than filtered out of
// the loaded catalog: the catalog is scoped by SHOPIFY_COLLECTION_PATH, and a
// promotion regularly includes bottles outside that scope (36 of the 89 in
// Seelbach's Bourbon Heritage Month deal). Filtering locally would hide them.
let COLLECTIONS = [];          // [{handle, title}]
let activeCollection = null;   // {handle, title} or null for the whole catalog

function resolveCollectionInput(raw) {
  const v = (raw || '').trim();
  if (!v) return null;
  // Accept a pasted collection URL, so a link from the store works as-is.
  const urlMatch = v.match(/\/collections\/([A-Za-z0-9_-]+)/);
  if (urlMatch) {
    const known = COLLECTIONS.find(c => c.handle === urlMatch[1]);
    return known || { handle: urlMatch[1], title: urlMatch[1] };
  }
  const lower = v.toLowerCase();
  const byTitle = COLLECTIONS.find(c => c.title.toLowerCase() === lower);
  if (byTitle) return byTitle;
  const byHandle = COLLECTIONS.find(c => c.handle.toLowerCase() === lower);
  if (byHandle) return byHandle;
  // Unlisted or brand-new collection: treat the raw text as a handle and let
  // the server try it. An unknown handle comes back as an empty list, not an
  // error, so the UI says "0 products" rather than looking broken.
  if (/^[A-Za-z0-9][A-Za-z0-9_-]*$/.test(v)) return { handle: v, title: v };
  return { handle: v, title: v, invalid: true };
}

async function loadCollectionList() {
  try {
    const r = await fetch('/api/collections.json');
    if (!r.ok) return;
    const data = await r.json();
    COLLECTIONS = data.collections || [];
    const dl = document.getElementById('collection-list');
    dl.innerHTML = COLLECTIONS.map(c =>
      '<option value="' + c.title.replace(/"/g, '&quot;') + '">' + c.handle + '</option>').join('');
  } catch (err) {
    // The catalog still works without the type-ahead; a handle can be typed.
    console.warn('collection list unavailable:', err.message);
  }
}

function showCollectionNote() {
  const note = document.getElementById('collection-note');
  if (!activeCollection) { note.style.display = 'none'; return; }
  document.getElementById('collection-note-text').textContent =
    'Showing collection “' + activeCollection.title + '” (' + RAW.length + ' product'
    + (RAW.length === 1 ? '' : 's') + ') — fetched live from the store, including bottles outside this catalog’s normal scope.';
  note.style.display = 'flex';
}

async function loadProducts(collection) {
  const wrap = document.getElementById('loading-wrap');
  const status = document.getElementById('status');
  document.getElementById('table-wrap').style.display = 'none';
  document.querySelector('.spinner').style.display = '';
  document.getElementById('loading-msg').textContent = collection
    ? 'Fetching “' + collection.title + '” from the store…'
    : 'Fetching products…';
  wrap.style.display = 'flex';
  status.className = '';
  try {
    const url = collection
      ? '/api/products.json?collection=' + encodeURIComponent(collection.handle)
      : '/api/products.json';
    const r = await fetch(url);
    if (!r.ok) {
      let msg = 'HTTP ' + r.status;
      try { const e = await r.json(); if (e.error) msg = e.error; } catch (_) {}
      throw new Error(msg);
    }
    const data = await r.json();
    RAW = mapProducts(data.products);
    activeCollection = collection;
    wrap.style.display = 'none';
    document.getElementById('table-wrap').style.display = '';
    document.getElementById('main-controls').style.display = 'flex';
    status.textContent = collection
      ? 'Loaded ' + RAW.length + ' from “' + collection.title + '”'
      : 'Loaded ' + RAW.length + ' products';
    populateFilters();
    applyPendingParams();
    showCollectionNote();
    render();
  } catch (err) {
    document.getElementById('loading-msg').textContent = 'Failed to load products: ' + err.message;
    document.querySelector('.spinner').style.display = 'none';
    status.textContent = 'Error';
    status.className = 'error';
  }
}

// ── URL parameters ─────────────────────────────────────────────────────────
// Every filter and the sort live in the query string, so any view is a
// shareable link: ?collection=2026-bhm-case-deal&avail=in&sort=discount
// The URL is rewritten with replaceState on each change, so the address bar
// always reflects what is on screen without piling up history entries.
const SORT_COLS = ['title', 'vendor', 'product_type', 'price', 'discount',
                   'available', 'variant_count', 'created_at'];
// Friendlier spellings for the ones worth typing by hand.
const SORT_ALIASES = { type: 'product_type', created: 'created_at', date: 'created_at',
                       name: 'title', variants: 'variant_count', stock: 'available' };
const AVAIL_ALIASES = { 'in': 'true', 'instock': 'true', 'in-stock': 'true', 'yes': 'true',
                        'out': 'false', 'oos': 'false', 'no': 'false' };

function syncUrl() {
  const u = new URL(window.location.href);
  const set = (k, v) => { if (v) u.searchParams.set(k, v); else u.searchParams.delete(k); };
  set('collection', activeCollection ? activeCollection.handle : '');
  set('q', document.getElementById('search').value.trim());
  set('type', document.getElementById('filter-type').value);
  set('vendor', document.getElementById('filter-vendor').value);
  set('avail', document.getElementById('filter-avail').value);
  // Only pin the sort when it differs from the default view.
  if (sortCol === 'created_at' && sortDir === -1) { u.searchParams.delete('sort'); u.searchParams.delete('dir'); }
  else { set('sort', sortCol); set('dir', sortDir === 1 ? 'asc' : 'desc'); }
  history.replaceState(null, '', u);
}

// Applied once, after the first populateFilters() — the type and vendor options
// do not exist until products have loaded, so setting those selects any earlier
// would silently not stick.
let pendingParams = null;

function readParams() {
  const q = new URL(window.location.href).searchParams;
  const rawSort = (q.get('sort') || '').trim().toLowerCase();
  const sort = SORT_ALIASES[rawSort] || rawSort;
  const rawAvail = (q.get('avail') || '').trim().toLowerCase();
  return {
    collection: (q.get('collection') || '').trim(),
    q: q.get('q') || '',
    type: q.get('type') || '',
    vendor: q.get('vendor') || '',
    avail: AVAIL_ALIASES[rawAvail] !== undefined ? AVAIL_ALIASES[rawAvail]
         : (rawAvail === 'true' || rawAvail === 'false') ? rawAvail : '',
    sort: SORT_COLS.includes(sort) ? sort : '',
    dir: (q.get('dir') || '').trim().toLowerCase() === 'asc' ? 1
       : (q.get('dir') || '').trim().toLowerCase() === 'desc' ? -1 : null,
  };
}

function applyPendingParams() {
  if (!pendingParams) return;
  const pp = pendingParams;
  pendingParams = null;
  if (pp.q) document.getElementById('search').value = pp.q;
  if (pp.avail) document.getElementById('filter-avail').value = pp.avail;
  // A type or vendor that this collection does not contain is dropped rather
  // than applied, which would show an empty table with no visible cause.
  const typeEl = document.getElementById('filter-type');
  const vendorEl = document.getElementById('filter-vendor');
  if (pp.type && [...typeEl.options].some(o => o.value === pp.type)) typeEl.value = pp.type;
  if (pp.vendor && [...vendorEl.options].some(o => o.value === pp.vendor)) vendorEl.value = pp.vendor;
  if (pp.sort) {
    sortCol = pp.sort;
    sortDir = pp.dir !== null ? pp.dir : (pp.sort === 'discount' || pp.sort === 'created_at' ? -1 : 1);
  }
  markSortHeader();
}

function markSortHeader() {
  document.querySelectorAll('thead th').forEach(t => t.classList.remove('sort-asc', 'sort-desc'));
  const th = document.querySelector('th[data-col="' + sortCol + '"]');
  if (th) th.classList.add(sortDir === 1 ? 'sort-asc' : 'sort-desc');
}

document.getElementById('filter-collection').addEventListener('change', () => {
  const target = resolveCollectionInput(document.getElementById('filter-collection').value);
  if (target && target.handle === (activeCollection && activeCollection.handle)) return;
  loadProducts(target);
});

document.getElementById('collection-clear').addEventListener('click', (e) => {
  e.preventDefault();
  document.getElementById('filter-collection').value = '';
  loadProducts(null);
});

// Deep link: /?collection=<handle> loads straight into that collection, so a
// promotion view can be bookmarked or shared.
(async function init() {
  const params = readParams();
  pendingParams = params;
  markSortHeader();
  loadCollectionList();
  const wanted = params.collection;
  await loadProducts(wanted ? { handle: wanted, title: wanted } : null);
  if (wanted) {
    // Once the list arrives, upgrade the handle in the box to its real title.
    const known = COLLECTIONS.find(c => c.handle === wanted);
    if (known) {
      activeCollection = known;
      document.getElementById('filter-collection').value = known.title;
      showCollectionNote();
    } else {
      document.getElementById('filter-collection').value = wanted;
    }
  }
})();
</script>
</body>
</html>
